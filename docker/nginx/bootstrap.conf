# Config temporária usada apenas durante a emissão inicial do certificado.
# Serve apenas HTTP para que o certbot possa completar o desafio ACME webroot.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'VextromPlatform - aguardando certificado SSL\n';
        add_header Content-Type text/plain;
    }
}
