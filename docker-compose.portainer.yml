# Portainer CE — gerenciamento visual de containers via web.
# Roda isolado dos outros stacks, não interfere em nada.
#
# Subir:
#   docker compose -f docker-compose.portainer.yml -p portainer up -d
#
# Atualizar após enviar este arquivo ao servidor:
#   docker compose -f docker-compose.portainer.yml -p portainer up -d --force-recreate
#
# Derrubar:
#   docker compose -f docker-compose.portainer.yml -p portainer down
#
# Acesso: https://IP-DO-SERVIDOR:9443
# Na primeira abertura crie o usuário admin.
#
# Segurança — libere a porta só para o seu IP:
#   ufw allow from SEU-IP to any port 9443

services:
  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    user: root
    ports:
      - "8000:8000"   # tunnel para agentes Portainer (necessário para acesso local)
      - "9443:9443"   # HTTPS
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - portainer_data:/data
    command: --host=unix:///var/run/docker.sock

volumes:
  portainer_data:
    name: vextrom_portainer_data
