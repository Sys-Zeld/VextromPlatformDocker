# Portainer CE — uso STANDALONE (sem Nginx).
#
# ⚠ Em PRODUÇÃO o Portainer já está incluído no docker-compose.prod.yml
#   e é acessível via https://app.vextrom.com.br/serveradm/ sem porta exposta.
#
# Use este arquivo apenas para rodar o Portainer isolado (ex: staging, testes locais).
#
# Subir:
#   docker compose -f docker-compose.portainer.yml -p portainer up -d
#
# Derrubar:
#   docker compose -f docker-compose.portainer.yml -p portainer down
#
# Acesso: https://IP-DO-SERVIDOR:9443
# Na primeira abertura crie o usuário admin.
#
# Segurança — libere a porta só para o seu IP:
#   ufw allow from SEU-IP to any port 9443
#   ufw deny 9443

services:
  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    user: root
    ports:
      - "8000:8000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - portainer_data:/data
    command: --host=unix:///var/run/docker.sock

volumes:
  portainer_data:
    name: vextrom_portainer_data
