# Base compartilhada entre dev e prod.
# Não rode este arquivo diretamente — use o override de dev (automático) ou prod:
#
#   Dev:  docker compose up --build
#   Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zeldchip}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
      - vextrom_net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 200mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vextrom}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vextrom-minio-change-me}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vextrom}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vextrom-minio-change-me}
      S3_BUCKET: ${S3_BUCKET:-vextrom-assets}
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-vextrom} ${MINIO_ROOT_PASSWORD:-vextrom-minio-change-me}; do sleep 2; done;
                  mc mb --ignore-existing local/${S3_BUCKET:-vextrom-assets};
                  mc anonymous set none local/${S3_BUCKET:-vextrom-assets};"

  app:
    build:
      context: .
      target: prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - dados_volume:/app/dados

networks:
  vextrom_net:
    external: true
    name: vextrom_net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  dados_volume:
