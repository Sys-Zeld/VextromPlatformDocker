# Overrides de produção.
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d

services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  redis:
    restart: unless-stopped

  app:
    build:
      target: prod
    restart: unless-stopped
    # Porta NÃO exposta ao host — nginx faz o proxy internamente
    env_file:
      - .env.prod
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - app
      - portainer
      - pgadmin

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM;
                  while :; do
                    certbot renew --quiet --webroot --webroot-path /var/www/certbot;
                    sleep 12h & wait $${!};
                  done"

  # pgAdmin 4 — acessível em https://${DOMAIN}/admdatabase/
  # Sem porta exposta ao host — nginx faz o proxy internamente.
  # Conecta automaticamente ao postgres do projeto via servers.json.
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:             ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD:          ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE:        "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      SCRIPT_NAME:                       /admdatabase
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Portainer — acessível em https://${DOMAIN}/serveradm/
  # Sem portas expostas ao host — nginx faz o proxy internamente
  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    user: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - portainer_data:/data
    command: >
      --base-url /serveradm
      --host unix:///var/run/docker.sock

volumes:
  certbot_www:
    name: vextrom_certbot_www
  certbot_certs:
    name: vextrom_certbot_certs
  portainer_data:
    name: vextrom_portainer_data
  pgadmin_data:
    name: vextrom_pgadmin_data
