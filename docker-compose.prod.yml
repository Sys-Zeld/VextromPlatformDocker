# Overrides de produção.
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d

services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M

  redis:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  minio:
    restart: unless-stopped
    ports:
      - "127.0.0.1:9001:9001"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  app:
    build:
      target: prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_add:
      - SYS_ADMIN
    shm_size: '1gb'
    env_file:
      - .env.prod
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M

  nginx:
    image: nginx:1.30.0-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - app
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
    entrypoint: >
      /bin/sh -c "trap exit TERM;
                  while :; do
                    certbot renew --quiet --webroot --webroot-path /var/www/certbot;
                    sleep 12h & wait $${!};
                  done"


volumes:
  certbot_www:
    name: vextrom_certbot_www
  certbot_certs:
    name: vextrom_certbot_certs
