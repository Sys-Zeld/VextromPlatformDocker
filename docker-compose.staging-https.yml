# Staging com HTTPS usando certificado auto-assinado.
# O certificado é gerado automaticamente pelo serviço cert-gen na primeira execução.
# Nenhum script externo é necessário.
#
# Pré-requisito — definir DOMAIN no .env.staging:
#   DOMAIN=192.168.1.100
#   APP_BASE_URL=https://192.168.1.100
#
# Subir:
#   docker compose -f docker-compose.yml -f docker-compose.staging-https.yml \
#     --env-file .env.staging -p vextrom-staging-https up -d --build
#
# Migrations (após subir):
#   docker compose -f docker-compose.yml -f docker-compose.staging-https.yml \
#     --env-file .env.staging -p vextrom-staging-https exec app npm run db:migrate
#
# Derrubar:
#   docker compose -f docker-compose.yml -f docker-compose.staging-https.yml \
#     --env-file .env.staging -p vextrom-staging-https down -v

services:
  postgres:
    restart: "no"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  redis:
    restart: "no"

  app:
    build:
      target: prod
    restart: "no"
    env_file:
      - .env.staging

  # Gera o certificado auto-assinado antes do nginx subir.
  # Encerra com sucesso após gerar; se o cert já existir, apenas pula.
  # $$DOMAIN no script é escapado do docker-compose e vira $DOMAIN no shell,
  # que lê o valor da variável de ambiente DOMAIN injetada pelo 'environment:'.
  cert-gen:
    image: alpine
    restart: "no"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - self_signed_certs:/certs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -f "/certs/$$DOMAIN/fullchain.pem" ]; then
          echo "Certificado já existe para $$DOMAIN, pulando."
          exit 0
        fi
        echo "Instalando openssl..."
        apk add --no-cache openssl > /dev/null 2>&1
        mkdir -p "/certs/$$DOMAIN"
        if echo "$$DOMAIN" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
          SAN="IP:$$DOMAIN"
        else
          SAN="DNS:$$DOMAIN"
        fi
        echo "Gerando certificado para $$DOMAIN (SAN: $$SAN)..."
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
          -keyout "/certs/$$DOMAIN/privkey.pem" \
          -out    "/certs/$$DOMAIN/fullchain.pem" \
          -subj   "/C=BR/O=Vextrom Staging/CN=$$DOMAIN" \
          -addext "subjectAltName=$$SAN"
        echo "Certificado gerado com sucesso para $$DOMAIN"

  # pgAdmin 4 — acessível em https://IP/admdatabase/
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: "no"
    environment:
      PGADMIN_DEFAULT_EMAIL:             ${PGADMIN_EMAIL:-admin@staging.local}
      PGADMIN_DEFAULT_PASSWORD:          ${PGADMIN_PASSWORD:-staging@pgadmin}
      PGADMIN_CONFIG_SERVER_MODE:        "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      SCRIPT_NAME:                       /admdatabase
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Portainer — acessível em https://IP/serveradm/
  portainer:
    image: portainer/portainer-ce:latest
    restart: "no"
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - portainer_data:/data
    command: >
      --base-url /serveradm
      --http-addr :9000
      --host unix:///var/run/docker.sock

  nginx:
    image: nginx:1.27-alpine
    restart: "no"
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - self_signed_certs:/etc/letsencrypt/live:ro
    depends_on:
      cert-gen:
        condition: service_completed_successfully
      app:
        condition: service_started
      portainer:
        condition: service_started
      pgadmin:
        condition: service_started

volumes:
  self_signed_certs:
  pgadmin_data:
  portainer_data:
