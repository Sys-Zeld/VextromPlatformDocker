# Carregado automaticamente pelo Docker Compose em desenvolvimento.
# Ativa: hot-reload com nodemon, portas expostas para ferramentas locais,
# e sobrescreve as URLs de banco/redis para apontar aos serviços do compose.

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  app:
    build:
      target: dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      # Sobrescreve os hosts do .env (localhost) para os nomes de serviço do compose
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://postgres:zeldchip@postgres:5432/dbspeflow
      SPECFLOW_DATABASE_URL: postgres://postgres:zeldchip@postgres:5432/dbspeflow
      MODULE_SPEC_DATABASE_URL: postgres://postgres:zeldchip@postgres:5432/dbmodulespec
      REPORT_SERVICE_DATABASE_URL: postgres://postgres:zeldchip@postgres:5432/reportservice
      CONFIG_DATABASE_URL: postgres://postgres:zeldchip@postgres:5432/configdb
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: vextrom-assets
      S3_ACCESS_KEY_ID: vextrom
      S3_SECRET_ACCESS_KEY: vextrom-minio-change-me
      S3_FORCE_PATH_STYLE: "true"
      REPORT_PDF_RENDERER: puppeteer
      PUPPETEER_SERVER_URL: http://puppeteer:4000
      PUPPETEER_SKIP_DOWNLOAD: "true"
    depends_on:
      - puppeteer
    volumes:
      - .:/app                  # hot-reload: código atualizado em tempo real
      - /app/node_modules       # preserva node_modules da imagem
      - dados_volume:/app/dados

  puppeteer:
    build:
      context: .
      target: dev
    command: ["node", "puppeteer-server.js"]
    shm_size: '2gb'
    environment:
      HOSTNAME_ADVERTISE: puppeteer
      PUPPETEER_SKIP_DOWNLOAD: "true"
      # Chrome instalado pelo pptruser da imagem base — aponta root para o mesmo cache
      PUPPETEER_CACHE_DIR: /home/pptruser/.cache/puppeteer
    volumes:
      - ./puppeteer-server.js:/app/puppeteer-server.js:ro
      - /app/node_modules
